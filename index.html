<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Стеклянный короб — минимум пересечений</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(2.5, 2, 4);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.1;
    controls.minDistance = 2;
    controls.maxDistance = 10;

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    const pointLight = new THREE.PointLight(0xffffff, 0.8, 50);
    pointLight.position.set(-5, 5, 5);
    scene.add(pointLight);

    const W = 2;
    const H = 0.5;
    const D = 1;

    const glassGeometry = new THREE.BoxGeometry(W, H, D);
    const glassMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.3,
      roughness: 0.0,
      metalness: 0.0,
      ior: 1.5,
      transmission: 0.9,
      clearcoat: 1.0,
      clearcoatRoughness: 0.0,
      reflectivity: 0.5,
      side: THREE.DoubleSide
    });
    const glassBox = new THREE.Mesh(glassGeometry, glassMaterial);
    scene.add(glassBox);

    // Тоньше и с небольшим смещением, чтобы стыки не совпадали точно
    const ft = 0.02; // было 0.03 — теперь тоньше
    const metalMaterial = new THREE.MeshStandardMaterial({
      color: 0xaaaaaa,
      roughness: 0.3,
      metalness: 0.9
    });

    const hw = W / 2;
    const hh = H / 2;
    const hd = D / 2;

    // Смещение, чтобы рёбра не сходились ровно в одной точке
    const offset = 0.01;

    // Рёбра вдоль X
    const xEdgeGeo = new THREE.BoxGeometry(W - offset, ft, ft);
    [[0, hh + offset/2, hd], [0, hh + offset/2, -hd], [0, -hh - offset/2, hd], [0, -hh - offset/2, -hd]].forEach(p => {
      const e = new THREE.Mesh(xEdgeGeo, metalMaterial);
      e.position.set(...p);
      scene.add(e);
    });

    // Рёбра вдоль Y
    const yEdgeGeo = new THREE.BoxGeometry(ft, H - offset, ft);
    [[hw, 0, hd], [hw, 0, -hd], [-hw, 0, hd], [-hw, 0, -hd]].forEach(p => {
      const e = new THREE.Mesh(yEdgeGeo, metalMaterial);
      e.position.set(...p);
      scene.add(e);
    });

    // Рёбра вдоль Z
    const zEdgeGeo = new THREE.BoxGeometry(ft, ft, D - offset);
    [[hw, hh, 0], [hw, -hh, 0], [-hw, hh, 0], [-hw, -hh, 0]].forEach(p => {
      const e = new THREE.Mesh(zEdgeGeo, metalMaterial);
      e.position.set(...p);
      scene.add(e);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
