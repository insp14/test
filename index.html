<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Лифт в пустоте — только индикатор</title>
    <style>
      body { margin: 0; overflow: hidden; background: #000; }
      canvas { display: block; }

      #hint {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        color: #333;
        font-family: 'Segoe UI', sans-serif;
        font-size: 13px;
        letter-spacing: 0.5px;
        pointer-events: none;
        user-select: none;
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <div id="hint">Нажмите на двери, чтобы открыть лифт</div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from 'three';

      // ============================================================
      //  Сцена — полная тьма
      // ============================================================
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000);
      scene.fog = new THREE.FogExp2(0x000000, 0.22);

      // ============================================================
      //  Камера — жёстко зафиксирована
      // ============================================================
      const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 1.6, 4.8);
      camera.lookAt(0, 1.6, 0);

      // ============================================================
      //  Рендерер
      // ============================================================
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      document.body.appendChild(renderer.domElement);

      // ============================================================
      //  Освещение
      // ============================================================

      // 1. Лампа-индикатор над дверью (основной источник)
      const indicatorLight = new THREE.PointLight(0xffffff, 2.8, 5.5);
      indicatorLight.position.set(0, 2.95, 0.35);
      indicatorLight.castShadow = true;
      indicatorLight.shadow.mapSize.set(1024, 1024);
      indicatorLight.shadow.camera.left = -3.5;
      indicatorLight.shadow.camera.right = 3.5;
      indicatorLight.shadow.camera.top = 4.5;
      indicatorLight.shadow.camera.bottom = -1;
      scene.add(indicatorLight);

      // 2. Тусклый холодный свет ровно над лифтом
      const overheadLight = new THREE.PointLight(0x4466aa, 0.6, 6);
      overheadLight.position.set(0, 3.8, 0);
      scene.add(overheadLight);

      // ============================================================
      //  Процедурные текстуры
      // ============================================================

      function createDoorTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');

        const grad = ctx.createLinearGradient(0, 0, 256, 0);
        grad.addColorStop(0, '#333338');
        grad.addColorStop(0.5, '#4a4a52');
        grad.addColorStop(1, '#333338');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 256, 512);

        for (let i = 0; i < 256; i += 32) {
          ctx.fillStyle = 'rgba(0,0,0,0.18)';
          ctx.fillRect(i, 0, 2, 512);
          ctx.fillStyle = 'rgba(255,255,255,0.06)';
          ctx.fillRect(i + 2, 0, 1, 512);
        }

        for (let i = 0; i < 800; i++) {
          const x = Math.random() * 256;
          const y = Math.random() * 512;
          ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.05})`;
          ctx.fillRect(x, y, 1, 1);
        }

        const texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        return texture;
      }

      function createInteriorTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');

        const grad = ctx.createLinearGradient(0, 0, 0, 512);
        grad.addColorStop(0, '#050507');
        grad.addColorStop(0.4, '#000000');
        grad.addColorStop(1, '#000000');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 256, 512);

        const texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        return texture;
      }

      const doorTexture = createDoorTexture();
      const interiorTexture = createInteriorTexture();

      // ============================================================
      //  Материалы
      // ============================================================
      const doorMaterial = new THREE.MeshStandardMaterial({
        map: doorTexture,
        roughness: 0.45,
        metalness: 0.75,
        side: THREE.DoubleSide
      });

      const frameMaterial = new THREE.MeshStandardMaterial({
        color: 0x222226,
        roughness: 0.3,
        metalness: 0.8
      });

      const trimMaterial = new THREE.MeshStandardMaterial({
        color: 0x151518,
        roughness: 0.6,
        metalness: 0.4
      });

      const interiorMaterial = new THREE.MeshStandardMaterial({
        map: interiorTexture,
        roughness: 0.9,
        metalness: 0.0
      });

      const indicatorMaterial = new THREE.MeshStandardMaterial({
        color: 0xff8800,
        emissive: 0xff4400,
        emissiveIntensity: 0.5,
        roughness: 0.25
      });

      // ============================================================
      //  Геометрия дверей
      // ============================================================
      const doorWidth = 1.0;
      const doorHeight = 2.6;
      const doorThickness = 0.09;
      const gap = 0.015;

      const elevatorGroup = new THREE.Group();
      scene.add(elevatorGroup);

      // Левая створка
      const leftDoorGeo = new THREE.BoxGeometry(doorWidth, doorHeight, doorThickness);
      const leftDoor = new THREE.Mesh(leftDoorGeo, doorMaterial);
      leftDoor.position.set(-(doorWidth / 2 + gap / 2), doorHeight / 2, 0);
      leftDoor.castShadow = true;
      leftDoor.receiveShadow = true;
      elevatorGroup.add(leftDoor);

      // Правая створка
      const rightDoorGeo = new THREE.BoxGeometry(doorWidth, doorHeight, doorThickness);
      const rightDoor = new THREE.Mesh(rightDoorGeo, doorMaterial);
      rightDoor.position.set(doorWidth / 2 + gap / 2, doorHeight / 2, 0);
      rightDoor.castShadow = true;
      rightDoor.receiveShadow = true;
      elevatorGroup.add(rightDoor);

      // ============================================================
      //  Рама вокруг дверей
      // ============================================================

      // Верхняя перемычка
      const topFrameGeo = new THREE.BoxGeometry(doorWidth * 2 + 0.3, 0.25, 0.12);
      const topFrame = new THREE.Mesh(topFrameGeo, frameMaterial);
      topFrame.position.set(0, doorHeight + 0.125, 0);
      topFrame.castShadow = true;
      elevatorGroup.add(topFrame);

      // Левый косяк
      const leftFrameGeo = new THREE.BoxGeometry(0.15, doorHeight + 0.25, 0.12);
      const leftFrame = new THREE.Mesh(leftFrameGeo, frameMaterial);
      leftFrame.position.set(-(doorWidth + 0.075 + gap / 2), doorHeight / 2, 0);
      leftFrame.castShadow = true;
      elevatorGroup.add(leftFrame);

      // Правый косяк
      const rightFrameGeo = new THREE.BoxGeometry(0.15, doorHeight + 0.25, 0.12);
      const rightFrame = new THREE.Mesh(rightFrameGeo, frameMaterial);
      rightFrame.position.set(doorWidth + 0.075 + gap / 2, doorHeight / 2, 0);
      rightFrame.castShadow = true;
      elevatorGroup.add(rightFrame);

      // Порог
      const sillGeo = new THREE.BoxGeometry(doorWidth * 2 + 0.3, 0.05, 0.14);
      const sill = new THREE.Mesh(sillGeo, trimMaterial);
      sill.position.set(0, 0.025, 0.02);
      elevatorGroup.add(sill);

      // ============================================================
      //  Табло-индикатор
      // ============================================================
      const indicatorGeo = new THREE.BoxGeometry(0.3, 0.12, 0.02);
      const indicator = new THREE.Mesh(indicatorGeo, indicatorMaterial);
      indicator.position.set(0, doorHeight + 0.18, 0.07);
      elevatorGroup.add(indicator);

      // ============================================================
      //  Интерьер лифта (без задней стенки)
      // ============================================================
      const interiorGroup = new THREE.Group();
      elevatorGroup.add(interiorGroup);

      // Боковые стены
      const sideWallGeo = new THREE.BoxGeometry(0.05, doorHeight, 0.8);
      const leftSideWall = new THREE.Mesh(sideWallGeo, interiorMaterial);
      leftSideWall.position.set(-(doorWidth + gap / 2), doorHeight / 2, -0.4);
      interiorGroup.add(leftSideWall);

      const rightSideWall = new THREE.Mesh(sideWallGeo, interiorMaterial);
      rightSideWall.position.set(doorWidth + gap / 2, doorHeight / 2, -0.4);
      interiorGroup.add(rightSideWall);

      // Потолок
      const ceilingGeo = new THREE.BoxGeometry(doorWidth * 2, 0.05, 0.8);
      const ceiling = new THREE.Mesh(ceilingGeo, interiorMaterial);
      ceiling.position.set(0, doorHeight, -0.4);
      interiorGroup.add(ceiling);

      // Пол лифта
      const elevatorFloorGeo = new THREE.BoxGeometry(doorWidth * 2, 0.05, 0.85);
      const elevatorFloor = new THREE.Mesh(elevatorFloorGeo, interiorMaterial);
      elevatorFloor.position.set(0, 0.025, -0.4);
      interiorGroup.add(elevatorFloor);

      // Лампа в потолке (декоративная)
      const lampGeo = new THREE.CircleGeometry(0.1, 24);
      const lampMat = new THREE.MeshStandardMaterial({
        color: 0x223344,
        emissive: 0x112233,
        emissiveIntensity: 0.3
      });
      const lamp = new THREE.Mesh(lampGeo, lampMat);
      lamp.rotation.x = -Math.PI / 2;
      lamp.position.set(0, doorHeight - 0.03, -0.4);
      interiorGroup.add(lamp);

      // ============================================================
      //  Анимация дверей — только открытие, без закрытия
      // ============================================================
      let doorsOpen = false;
      let doorAnimating = false;
      let animationStart = 0;
      const animationDuration = 1.5;

      const doorOpenOffset = doorWidth + gap;

      function openDoors() {
        // Открываем только один раз — повторные клики игнорируем
        if (doorAnimating || doorsOpen) return;
        doorAnimating = true;
        doorsOpen = true;
        animationStart = performance.now();

        // Индикатор становится зелёным, свет — холоднее и ярче
        indicator.material.color.set(0x00ff66);
        indicator.material.emissive.set(0x00ff44);
        indicator.material.emissiveIntensity = 0.8;
        indicatorLight.color.set(0x66ffaa);
        indicatorLight.intensity = 3.5;
      }

      function updateDoorAnimation() {
        if (!doorAnimating) return;

        const elapsed = (performance.now() - animationStart) / 1000;
        const t = Math.min(elapsed / animationDuration, 1);
        const eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

        leftDoor.position.x = -(doorWidth / 2 + gap / 2) - eased * doorOpenOffset;
        rightDoor.position.x = (doorWidth / 2 + gap / 2) + eased * doorOpenOffset;

        if (t >= 1) {
          doorAnimating = false;
        }
      }

      // ============================================================
      //  Raycaster — клик по дверям
      // ============================================================
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();

      function onPointerDown(event) {
        pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
        pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(pointer, camera);
        const intersects = raycaster.intersectObjects([leftDoor, rightDoor]);

        if (intersects.length > 0) {
          openDoors();
        }
      }

      renderer.domElement.addEventListener('pointerdown', onPointerDown);

      // ============================================================
      //  Hover — курсор pointer только пока двери закрыты
      // ============================================================
      function onPointerMove(event) {
        if (doorsOpen) {
          renderer.domElement.style.cursor = 'default';
          return;
        }

        pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
        pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(pointer, camera);
        const intersects = raycaster.intersectObjects([leftDoor, rightDoor]);

        renderer.domElement.style.cursor = intersects.length > 0 ? 'pointer' : 'default';
      }

      renderer.domElement.addEventListener('pointermove', onPointerMove);

      // ============================================================
      //  Resize
      // ============================================================
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // ============================================================
      //  Render loop
      // ============================================================
      function animate() {
        requestAnimationFrame(animate);
        updateDoorAnimation();
        renderer.render(scene, camera);
      }

      animate();
    </script>
  </body>
</html>
