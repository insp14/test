<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Лифт в пустоте — только лампа-индикатор</title>
    <style>
      body { margin: 0; overflow: hidden; background: #000; }
      canvas { display: block; }

      #hint {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        color: #333;
        font-family: 'Segoe UI', sans-serif;
        font-size: 13px;
        letter-spacing: 0.5px;
        pointer-events: none;
        user-select: none;
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <div id="hint">Нажмите на двери или кнопку, чтобы открыть лифт</div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from 'three';

      // ============================================================
      //  Сцена — полная тьма
      // ============================================================
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000);
      scene.fog = new THREE.FogExp2(0x000000, 0.22); // плотный туман, растворяет всё сразу

      // ============================================================
      //  Камера — жёстко зафиксирована
      // ============================================================
      const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 1.6, 4.8);
      camera.lookAt(0, 1.6, 0);

      // ============================================================
      //  Рендерер
      // ============================================================
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      document.body.appendChild(renderer.domElement);

      // ============================================================
      //  Освещение — ТОЛЬКО лампа-индикатор
      // ============================================================
      const indicatorLight = new THREE.PointLight(0xffffff, 2.8, 5.5);
      indicatorLight.position.set(0, 2.95, 0.35); // прямо над табло
      indicatorLight.castShadow = true;
      indicatorLight.shadow.mapSize.set(1024, 1024);
      indicatorLight.shadow.camera.left = -3.5;
      indicatorLight.shadow.camera.right = 3.5;
      indicatorLight.shadow.camera.top = 4.5;
      indicatorLight.shadow.camera.bottom = -1;
      scene.add(indicatorLight);

      // Ambient убран полностью — без него тьма становится «настоящей»
      // Никаких других источников света нет.

      // ============================================================
      //  Процедурные текстуры
      // ============================================================

      function createDoorTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');

        // Металлический градиент
        const grad = ctx.createLinearGradient(0, 0, 256, 0);
        grad.addColorStop(0, '#333338');
        grad.addColorStop(0.5, '#4a4a52');
        grad.addColorStop(1, '#333338');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 256, 512);

        // Вертикальные рёбра
        for (let i = 0; i < 256; i += 32) {
          ctx.fillStyle = 'rgba(0,0,0,0.18)';
          ctx.fillRect(i, 0, 2, 512);
          ctx.fillStyle = 'rgba(255,255,255,0.06)';
          ctx.fillRect(i + 2, 0, 1, 512);
        }

        // Лёгкие царапины/шум
        for (let i = 0; i < 800; i++) {
          const x = Math.random() * 256;
          const y = Math.random() * 512;
          ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.05})`;
          ctx.fillRect(x, y, 1, 1);
        }

        const texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        return texture;
      }

      function createInteriorTexture() {
        // Текстура «пустоты» — просто тёмный градиент, чтобы не было ощущения «коробки»
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');

        const grad = ctx.createLinearGradient(0, 0, 0, 512);
        grad.addColorStop(0, '#050507');
        grad.addColorStop(0.4, '#000000');
        grad.addColorStop(1, '#000000');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 256, 512);

        const texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        return texture;
      }

      const doorTexture = createDoorTexture();
      const interiorTexture = createInteriorTexture();

      // ============================================================
      //  Материалы
      // ============================================================
      const doorMaterial = new THREE.MeshStandardMaterial({
        map: doorTexture,
        roughness: 0.45,
        metalness: 0.75,
        side: THREE.DoubleSide
      });

      const frameMaterial = new THREE.MeshStandardMaterial({
        color: 0x222226,
        roughness: 0.3,
        metalness: 0.8
      });

      const trimMaterial = new THREE.MeshStandardMaterial({
        color: 0x151518,
        roughness: 0.6,
        metalness: 0.4
      });

      const interiorMaterial = new THREE.MeshStandardMaterial({
        map: interiorTexture,
        roughness: 0.9,
        metalness: 0.0,
        transparent: true,
        opacity: 1.0
      });

      const buttonMaterial = new THREE.MeshStandardMaterial({
        color: 0xff3333,
        emissive: 0xff1111,
        emissiveIntensity: 0.35,
        roughness: 0.3,
        metalness: 0.2
      });

      const buttonFrameMaterial = new THREE.MeshStandardMaterial({
        color: 0x333339,
        roughness: 0.4,
        metalness: 0.6
      });

      const indicatorMaterial = new THREE.MeshStandardMaterial({
        color: 0x00ff66,
        emissive: 0x00cc55,
        emissiveIntensity: 0.65,
        roughness: 0.25
      });

      // ============================================================
      //  Геометрия дверей
      // ============================================================
      const doorWidth = 1.0;
      const doorHeight = 2.6;
      const doorThickness = 0.09;
      const gap = 0.015;

      const elevatorGroup = new THREE.Group();
      scene.add(elevatorGroup);

      // Левая створка
      const leftDoorGeo = new THREE.BoxGeometry(doorWidth, doorHeight, doorThickness);
      const leftDoor = new THREE.Mesh(leftDoorGeo,
