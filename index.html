<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Лифт в темноте — тестовая сцена</title>
    <style>
      body { margin: 0; overflow: hidden; background: #000; }
      canvas { display: block; }

      #hint {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        color: #555;
        font-family: 'Segoe UI', sans-serif;
        font-size: 14px;
        letter-spacing: 0.5px;
        pointer-events: none;
        user-select: none;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <div id="hint">Нажмите на двери лифта, чтобы открыть / закрыть</div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from 'three';

      // ============================================================
      //  Сцена — кромешная тьма
      // ============================================================
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000);
      scene.fog = new THREE.FogExp2(0x000000, 0.15);

      // ============================================================
      //  Камера — зафиксирована, смотрит прямо на двери
      // ============================================================
      const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 1.6, 4.5);
      camera.lookAt(0, 1.6, 0);

      // ============================================================
      //  Рендерер
      // ============================================================
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      document.body.appendChild(renderer.domElement);

      // ============================================================
      //  Освещение — только то, что освещает лифт
      // ============================================================
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.15);
      scene.add(ambientLight);

      // Свет над дверью (лампа)
      const elevatorLight = new THREE.PointLight(0xffd9a0, 2.0, 5);
      elevatorLight.position.set(0, 2.9, 0.4);
      scene.add(elevatorLight);

      // Направленный свет — чуть сверху-спереди, чтобы двери не были плоскими
      const keyLight = new THREE.DirectionalLight(0xffe8c0, 0.5);
      keyLight.position.set(0, 3, 3);
      keyLight.castShadow = true;
      keyLight.shadow.mapSize.set(1024, 1024);
      keyLight.shadow.camera.left = -3;
      keyLight.shadow.camera.right = 3;
      keyLight.shadow.camera.top = 4;
      keyLight.shadow.camera.bottom = 0;
      scene.add(keyLight);

      // Холодный свет изнутри лифта (включается при открытых дверях)
      const interiorLight = new THREE.PointLight(0xaaccff, 1.2, 4);
      interiorLight.position.set(0, 1.6, -0.6);
      interiorLight.visible = false;
      scene.add(interiorLight);

      // ============================================================
      //  Процедурные текстуры
      // ============================================================

      function createDoorTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');

        const grad = ctx.createLinearGradient(0, 0, 256, 0);
        grad.addColorStop(0, '#3a3a3e');
        grad.addColorStop(0.5, '#4a4a50');
        grad.addColorStop(1, '#3a3a3e');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 256, 512);

        for (let i = 0; i < 256; i += 32) {
          ctx.fillStyle = 'rgba(0,0,0,0.15)';
          ctx.fillRect(i, 0, 2, 512);
          ctx.fillStyle = 'rgba(255,255,255,0.05)';
          ctx.fillRect(i + 2, 0, 1, 512);
        }

        for (let i = 0; i < 600; i++) {
          const x = Math.random() * 256;
          const y = Math.random() * 512;
          ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.04})`;
          ctx.fillRect(x, y, 1, 1);
        }

        const texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        return texture;
      }

      function createInteriorTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');

        const grad = ctx.createLinearGradient(0, 0, 0, 512);
        grad.addColorStop(0, '#c8c8cc');
        grad.addColorStop(0.5, '#b0b0b4');
        grad.addColorStop(1, '#a0a0a4');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 256, 512);

        ctx.strokeStyle = 'rgba(0,0,0,0.12)';
        ctx.lineWidth = 1;
        for (let i = 0; i < 512; i += 64) {
          ctx.beginPath();
          ctx.moveTo(0, i);
          ctx.lineTo(256, i);
          ctx.stroke();
        }

        const texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        return texture;
      }

      // ============================================================
      //  Материалы
      // ============================================================
      const doorTexture = createDoorTexture();
      const doorMaterial = new THREE.MeshStandardMaterial({
        map: doorTexture,
        color: 0xffffff,
        roughness: 0.4,
        metalness: 0.7
      });

      const frameMaterial = new THREE.MeshStandardMaterial({
        color: 0x2a2a2e,
        roughness: 0.3,
        metalness: 0.8
      });

      const trimMaterial = new THREE.MeshStandardMaterial({
        color: 0x1a1a1c,
        roughness: 0.5,
        metalness: 0.5
      });

      const interiorTexture = createInteriorTexture();
      const interiorMaterial = new THREE.MeshStandardMaterial({
        map: interiorTexture,
        roughness: 0.35,
        metalness: 0.6
      });

      const buttonMaterial = new THREE.MeshStandardMaterial({
        color: 0xff4444,
        emissive: 0xff2222,
        emissiveIntensity: 0.4,
        roughness: 0.3,
        metalness: 0.2
      });

      const buttonFrameMaterial = new THREE.MeshStandardMaterial({
        color: 0x444444,
        roughness: 0.4,
        metalness: 0.6
      });

      const indicatorMaterial = new THREE.MeshStandardMaterial({
        color: 0x00ff66,
        emissive: 0x00ff44,
        emissiveIntensity: 0.5,
        roughness: 0.3
      });

      // ============================================================
      //  Геометрия дверей лифта
      // ============================================================
      const doorWidth = 1.0;
      const doorHeight = 2.6;
      const doorThickness = 0.08;
      const gap = 0.01;

      const elevatorGroup = new THREE.Group();
      scene.add(elevatorGroup);

      // --- Левая створка ---
      const leftDoorGeo = new THREE.BoxGeometry(doorWidth, doorHeight, doorThickness);
      const leftDoor = new THREE.Mesh(leftDoorGeo, doorMaterial);
      leftDoor.position.set(-(doorWidth / 2 + gap / 2), doorHeight / 2, 0);
      leftDoor.castShadow = true;
      leftDoor.receiveShadow = true;
      elevatorGroup.add(leftDoor);

      // --- Правая створка ---
      const rightDoorGeo = new THREE.BoxGeometry(doorWidth, doorHeight, doorThickness);
      const rightDoor = new THREE.Mesh(rightDoorGeo, doorMaterial);
      rightDoor.position.set(doorWidth / 2 + gap / 2, doorHeight / 2, 0);
      rightDoor.castShadow = true;
      rightDoor.receiveShadow = true;
      elevatorGroup.add(rightDoor);

      // ============================================================
      //  Рама вокруг дверей
      // ============================================================

      // Верхняя перемычка
      const topFrameGeo = new THREE.BoxGeometry(doorWidth * 2 + 0.3, 0.25, 0.12);
      const topFrame = new THREE.Mesh(topFrameGeo, frameMaterial);
      topFrame.position.set(0, doorHeight + 0.125, 0);
      elevatorGroup.add(topFrame);

      // Левый косяк
      const leftFrameGeo = new THREE.BoxGeometry(0.15, doorHeight + 0.25, 0.12);
      const leftFrame = new THREE.Mesh(leftFrameGeo, frameMaterial);
      leftFrame.position.set(-(doorWidth + 0.075 + gap / 2), doorHeight / 2, 0);
      elevatorGroup.add(leftFrame);

      // Правый косяк
      const rightFrameGeo = new THREE.BoxGeometry(0.15, doorHeight + 0.25, 0.12);
      const rightFrame = new THREE.Mesh(rightFrameGeo, frameMaterial);
      rightFrame.position.set(doorWidth + 0.075 + gap / 2, doorHeight / 2, 0);
      elevatorGroup.add(rightFrame);

      // Порог
      const sillGeo = new THREE.BoxGeometry(doorWidth * 2 + 0.3, 0.05, 0.14);
      const sill = new THREE.Mesh(sillGeo, trimMaterial);
      sill.position.set(0, 0.025, 0.02);
      elevatorGroup.add(sill);

      // ============================================================
      //  Табло с номером этажа
      // ============================================================
      const indicatorGeo = new THREE.BoxGeometry(0.3, 0.12, 0.02);
      const indicator = new THREE.Mesh(indicatorGeo, indicatorMaterial);
      indicator.position.set(0, doorHeight + 0.18, 0.07);
      elevatorGroup.add(indicator);

      // ============================================================
      //  Кнопка вызова
      // ============================================================
      const buttonFrameGeo = new THREE.BoxGeometry(0.12, 0.18, 0.03);
      const buttonFrame = new THREE.Mesh(buttonFrameGeo, buttonFrameMaterial);
      buttonFrame.position.set(doorWidth + 0.2, 1.2, 0.08);
      elevatorGroup.add(buttonFrame);

      const buttonGeo = new THREE.CylinderGeometry(0.025, 0.025, 0.02, 24);
      const button = new THREE.Mesh(buttonGeo, buttonMaterial);
      button.rotation.x = Math.PI / 2;
      button.position.set(doorWidth + 0.2, 1.2, 0.1);
      elevatorGroup.add(button);

      // ============================================================
      //  Интерьер лифта (виден при открытых дверях)
      // ============================================================
      const interiorGroup = new THREE.Group();
      elevatorGroup.add(interiorGroup);

      // Задняя стена
      const backWallGeo = new THREE.BoxGeometry(doorWidth * 2, doorHeight, 0.05);
      const backWall = new THREE.Mesh(backWallGeo, interiorMaterial);
      backWall.position.set(0, doorHeight / 2, -0.8);
      interiorGroup.add(backWall);

      // Боковые стены
      const sideWallGeo = new THREE.BoxGeometry(0.05, doorHeight, 0.8);
      const leftSideWall = new THREE.Mesh(sideWallGeo, interiorMaterial);
      leftSideWall.position.set(-(doorWidth + gap / 2), doorHeight / 2, -0.4);
      interiorGroup.add(leftSideWall);

      const rightSideWall = new THREE.Mesh(sideWallGeo, interiorMaterial);
      rightSideWall.position.set(doorWidth + gap / 2, doorHeight / 2, -0.4);
      interiorGroup.add(rightSideWall);

      // Потолок
      const ceilingGeo = new THREE.BoxGeometry(doorWidth * 2, 0.05, 0.8);
      const ceiling = new THREE.Mesh(ceilingGeo, interiorMaterial);
      ceiling.position.set(0, doorHeight, -0.4);
      interiorGroup.add(ceiling);

      // Пол лифта
      const elevatorFloorGeo = new THREE.BoxGeometry(doorWidth * 2, 0.05, 0.85);
      const elevatorFloor = new THREE.Mesh(elevatorFloorGeo, interiorMaterial);
      elevatorFloor.position.set(0, 0.025, -0.4);
      elevatorFloor.receiveShadow = true;
      interiorGroup.add(elevatorFloor);

      // Лампа в потолке
      const lampGeo = new THREE.CircleGeometry(0.12, 24);
      const lampMat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        emissive: 0xffffff,
        emissiveIntensity: 1.5
      });
      const lamp = new THREE.Mesh(lampGeo, lampMat);
      lamp.rotation.x = -Math.PI / 2;
      lamp.position.set(0, doorHeight - 0.03, -0.4);
      interiorGroup.add(lamp);

      // ============================================================
      //  Анимация дверей
      // ============================================================
      let doorsOpen = false;
      let doorAnimating = false;
      let animationStart = 0;
      const animationDuration = 1.5;

      const doorOpenOffset = doorWidth + gap;

      function toggleDoors() {
        if (doorAnimating) return;
        doorAnimating = true;
        animationStart = performance.now();
        doorsOpen = !doorsOpen;

        if (!doorsOpen) {
          button.material.emissiveIntensity = 0.8;
        } else {
          button.material.emissiveIntensity = 0.2;
        }

        interiorLight.visible = doorsOpen;

        indicator.material.color.set(doorsOpen ? 0x00ff66 : 0xff8800);
        indicator.material.emissive.set(doorsOpen ? 0x00ff44 : 0xff4400);
      }

      function updateDoorAnimation() {
        if (!doorAnimating) return;

        const elapsed = (performance.now() - animationStart) / 1000;
        const t = Math.min(elapsed / animationDuration, 1);
        const eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

        if (doorsOpen) {
          leftDoor.position.x = -(doorWidth / 2 + gap / 2) - eased * doorOpenOffset;
          rightDoor.position.x = (doorWidth / 2 + gap / 2) + eased * doorOpenOffset;
        } else {
          leftDoor.position.x = -(doorWidth / 2 + gap / 2) - (1 - eased) * doorOpenOffset;
          rightDoor.position.x = (doorWidth / 2 + gap / 2) + (1 - eased) * doorOpenOffset;
        }

        if (t >= 1) {
          doorAnimating = false;
        }
      }

      // ============================================================
      //  Raycaster — клик по дверям и кнопке
      // ============================================================
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();

      function onPointerDown(event) {
        pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
        pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(pointer, camera);
        const intersects = raycaster.intersectObjects([leftDoor, rightDoor, buttonFrame, button]);

        if (intersects.length > 0) {
          toggleDoors();
        }
      }

      renderer.domElement.addEventListener('pointerdown', onPointerDown);

      // ============================================================
      //  Hover — курсор pointer
      // ============================================================
      function onPointerMove(event) {
        pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
        pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(pointer, camera);
        const intersects = raycaster.intersectObjects([leftDoor, rightDoor, buttonFrame, button]);

        renderer.domElement.style.cursor = intersects.length > 0 ? 'pointer' : 'default';
      }

      renderer.domElement.addEventListener('pointermove', onPointerMove);

      // ============================================================
      //  Resize
      // ============================================================
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // ============================================================
      //  Render loop
      // ============================================================
      function animate() {
        requestAnimationFrame(animate);
        updateDoorAnimation();
        renderer.render(scene, camera);
      }

      animate();
    </script>
  </body>
</html>
