<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Короб: крышка и основа с металлической обводкой</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(2.5, 2, 4);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.1;
    controls.minDistance = 2;
    controls.maxDistance = 10;

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.3);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    const pointLight = new THREE.PointLight(0xffffff, 0.8, 50);
    pointLight.position.set(-5, 5, 5);
    scene.add(pointLight);

    const W = 1.6, H = 0.5, D = 1;
    const gap = 0.005; // небольшой зазор между крышкой и основой
    const midH = H / 2;

    function createTexture(width, height, drawFn) {
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      drawFn(ctx, width, height);
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    const glassTex = createTexture(512, 512, (ctx, w, h) => {
      ctx.fillStyle = '#f5faff';
      ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = '#cce0ff'; ctx.lineWidth = 1;
      for (let i = 0; i < 30; i++) {
        const x1 = Math.random() * w, y1 = Math.random() * h;
        const x2 = x1 + (Math.random() - 0.5) * w, y2 = y1 + (Math.random() - 0.5) * h;
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      }
      ctx.strokeStyle = '#446699'; ctx.lineWidth = 3;
      for (let i = 0; i < 40; i++) {
        const x1 = Math.random() * w, y1 = Math.random() * h;
        const x2 = x1 + (Math.random() - 0.5) * w, y2 = y1 + (Math.random() - 0.5) * h;
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      }
      ctx.fillStyle = '#223355'; ctx.globalAlpha = 0.6;
      for (let i = 0; i < 12; i++) {
        const r = Math.random() * 20 + 10;
        let x = Math.random() * w, y = Math.random() * h;
        if (Math.random() < 0.4) x = Math.random() < 0.5 ? Math.random() * 40 : w - Math.random() * 40;
        if (Math.random() < 0.4) y = Math.random() < 0.5 ? Math.random() * 40 : h - Math.random() * 40;
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      }
    });

    const metalTex = createTexture(512, 512, (ctx, w, h) => {
      ctx.fillStyle = '#dcf0ff'; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = '#eaf6ff'; ctx.globalAlpha = 0.2;
      for (let i = 0; i < 2500; i++) ctx.fillRect(Math.random() * w, Math.random() * h, 1, 1);
      ctx.globalAlpha = 0.35; ctx.fillStyle = '#557799';
      for (let i = 0; i < 10; i++) {
        ctx.beginPath();
        ctx.arc(Math.random() * w, Math.random() * h, Math.random() * 60 + 20, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 0.7; ctx.fillStyle = '#b85a2a'; 
      for (let i = 0; i < 8; i++) {
        const r = Math.random() * 50 + 15;
        ctx.beginPath(); ctx.arc(Math.random() * w, Math.random() * h, r, 0, Math.PI * 2); ctx.fill();
      }
    });

    const glassMaterial = new THREE.MeshPhysicalMaterial({
      map: glassTex,
      transparent: true,
      opacity: 0.32,
      roughness: 0.05,
      metalness: 0.0,
      ior: 1.52,
      transmission: 0.9,
      clearcoat: 1.0,
      clearcoatRoughness: 0.03,
      reflectivity: 0.55,
      side: THREE.DoubleSide
    });

    const metalMaterial = new THREE.MeshStandardMaterial({
      map: metalTex,
      roughness: 0.45,
      metalness: 0.8
    });

    const ft = 0.02;
    const hw = W / 2, hh = H / 2, hd = D / 2, offset = 0.01;

    // Верхняя часть (крышка)
    const topGlassGeo = new THREE.BoxGeometry(W, midH - gap / 2, D);
    const topGlass = new THREE.Mesh(topGlassGeo, glassMaterial);
    topGlass.position.y = midH - (midH - gap / 2) / 2;
    scene.add(topGlass);

    // Нижняя часть (основа)
    const botGlassGeo = new THREE.BoxGeometry(W, midH - gap / 2, D);
    const botGlass = new THREE.Mesh(botGlassGeo, glassMaterial);
    botGlass.position.y = -midH + (midH - gap / 2) / 2;
    scene.add(botGlass);

    // Металлическая обводка по линии раздела (горизонтальное кольцо)
    const ringGeo = new THREE.BoxGeometry(W - offset, ft, D - offset);
    const ring = new THREE.Mesh(ringGeo, metalMaterial);
    ring.position.y = 0;
    scene.add(ring);

    // Каркас ребер (обновлен с учетом разделения)
    const xEdgeGeo = new THREE.BoxGeometry(W - offset, ft, ft);
    [[0, hh + offset/2, hd], [0, hh + offset/2, -hd], [0, -hh - offset/2, hd], [0, -hh - offset/2, -hd]].forEach(p => {
      const e = new THREE.Mesh(xEdgeGeo, metalMaterial);
      e.position.set(...p);
      scene.add(e);
    });

    const yEdgeGeoTop = new THREE.BoxGeometry(ft, (midH - gap/2) - offset, ft);
    [[hw, midH - (midH - gap/2)/2, hd], [hw, midH - (midH - gap/2)/2, -hd], [-hw, midH - (midH - gap/2)/2, hd], [-hw, midH - (midH - gap/2)/2, -hd]].forEach(p => {
      const e = new THREE.Mesh(yEdgeGeoTop, metalMaterial);
      e.position.set(...p);
      scene.add(e);
    });

    const yEdgeGeoBot = new THREE.BoxGeometry(ft, (midH - gap/2) - offset, ft);
    [[hw, -midH + (midH - gap/2)/2, hd], [hw, -midH + (midH - gap/2)/2, -hd], [-hw, -midH + (midH - gap/2)/2, hd], [-hw, -midH + (midH - gap/2)/2, -hd]].forEach(p => {
      const e = new THREE.Mesh(yEdgeGeoBot, metalMaterial);
      e.position.set(...p);
      scene.add(e);
    });

    const zEdgeGeo = new THREE.BoxGeometry(ft, ft, D - offset);
    [[hw, hh, 0], [hw, -hh, 0], [-hw, hh, 0], [-hw, -hh, 0]].forEach(p => {
      const e = new THREE.Mesh(zEdgeGeo, metalMaterial);
      e.position.set(...p);
      scene.add(e);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
