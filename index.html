<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Стеклянный короб — бело‑голубой металл и заметные царапины</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(2.5, 2, 4);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.1;
    controls.minDistance = 2;
    controls.maxDistance = 10;

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    const pointLight = new THREE.PointLight(0xffffff, 0.8, 50);
    pointLight.position.set(-5, 5, 5);
    scene.add(pointLight);

    const W = 2;
    const H = 0.5;
    const D = 1;

    // Генерация процедурных текстур (без внешних файлов)
    function createTexture(width, height, drawFn) {
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      drawFn(ctx, width, height);
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    // Текстура стекла: более заметные царапины и трещины
    const glassTex = createTexture(512, 512, (ctx, w, h) => {
      ctx.fillStyle = '#e6f0ff'; // чуть светлее, чтобы царапины выделялись
      ctx.fillRect(0, 0, w, h);
      
      // Яркие контрастные царапины
      ctx.strokeStyle = '#6688aa';
      ctx.lineWidth = 2; // толще, чем раньше
      for (let i = 0; i < 60; i++) { // больше штук
        const x1 = Math.random() * w, y1 = Math.random() * h;
        const x2 = x1 + (Math.random() - 0.5) * w, y2 = y1 + (Math.random() - 0.5) * h;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }

      // Более тёмные трещины для контраста
      ctx.strokeStyle = '#334466';
      ctx.lineWidth = 3;
      for (let i = 0; i < 20; i++) {
        const x1 = Math.random() * w, y1 = Math.random() * h;
        const x2 = x1 + (Math.random() - 0.5) * w, y2 = y1 + (Math.random() - 0.5) * h;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }
    });

    // Текстура металла: бело‑голубой оттенок с зернистостью и потертостями
    const metalTex = createTexture(512, 512, (ctx, w, h) => {
      // Базовый бело‑голубой цвет
      ctx.fillStyle = '#cfe8ff';
      ctx.fillRect(0, 0, w, h);

      // Лёгкая зернистость (светлые точки)
      ctx.fillStyle = '#eaf2ff';
      ctx.globalAlpha = 0.25;
      for (let i = 0; i < 3500; i++) {
        const x = Math.random() * w, y = Math.random() * h;
        ctx.fillRect(x, y, 1, 1);
      }

      // Потертости (тёмно‑серые пятна)
      ctx.globalAlpha = 0.3;
      ctx.fillStyle = '#556688';
      for (let i = 0; i < 15; i++) {
        ctx.beginPath();
        ctx.arc(Math.random() * w, Math.random() * h, Math.random() * 70 + 30, 0, Math.PI * 2);
        ctx.fill();
      }
    });

    const glassGeometry = new THREE.BoxGeometry(W, H, D);
    const glassMaterial = new THREE.MeshPhysicalMaterial({
      map: glassTex,
      color: 0xffffff,
      transparent: true,
      opacity: 0.35,
      roughness: 0.2,       // чуть более матовое, чтобы царапины читались
      metalness: 0.0,
      ior: 1.5,
      transmission: 0.85,
      clearcoat: 1.0,
      clearcoatRoughness: 0.2,
      reflectivity: 0.45,
      side: THREE.DoubleSide
    });
    const glassBox = new THREE.Mesh(glassGeometry, glassMaterial);
    scene.add(glassBox);

    const ft = 0.02;
    const metalMaterial = new THREE.MeshStandardMaterial({
      map: metalTex,
      color: 0xf0f8ff,       // очень светлый, почти белый, чтобы бело‑голубой тон был основным
      roughness: 0.5,        // чуть матовее — лучше читается текстура
      metalness: 0.75        // не «зеркальный хром», а благородный металл
    });

    const hw = W / 2;
    const hh = H / 2;
    const hd = D / 2;
    const offset = 0.01;

    const xEdgeGeo = new THREE.BoxGeometry(W - offset, ft, ft);
    [[0, hh + offset/2, hd], [0, hh + offset/2, -hd], [0, -hh - offset/2, hd], [0, -hh - offset/2, -hd]].forEach(p => {
      const e = new THREE.Mesh(xEdgeGeo, metalMaterial);
      e.position.set(...p);
      scene.add(e);
    });

    const yEdgeGeo = new THREE.BoxGeometry(ft, H - offset, ft);
    [[hw, 0, hd], [hw, 0, -hd], [-hw, 0, hd], [-hw, 0, -hd]].forEach(p => {
      const e = new THREE.Mesh(yEdgeGeo, metalMaterial);
      e.position.set(...p);
      scene.add(e);
    });

    const zEdgeGeo = new THREE.BoxGeometry(ft, ft, D - offset);
    [[hw, hh, 0], [hw, -hh, 0], [-hw, hh, 0], [-hw, -hh, 0]].forEach(p => {
      const e = new THREE.Mesh(zEdgeGeo, metalMaterial);
      e.position.set(...p);
      scene.add(e);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
