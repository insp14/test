<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Стеклянный короб с защёлкой и петлями</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(2.5, 2, 4);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Освещение
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    const pointLight = new THREE.PointLight(0xffffff, 0.8, 50);
    pointLight.position.set(-5, 5, 5);
    scene.add(pointLight);

    // Размеры короба (как у изначального прямоугольника)
    const W = 2;   // ширина (X)
    const H = 0.5;  // высота (Y)
    const D = 1;    // глубина (Z)

    // === СТЕКЛЯННЫЕ ГРАНИ ===
    const glassGeometry = new THREE.BoxGeometry(W, H, D);
    const glassMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.3,
      roughness: 0.0,
      metalness: 0.0,
      ior: 1.5,
      transmission: 0.9,
      clearcoat: 1.0,
      clearcoatRoughness: 0.0,
      reflectivity: 0.5,
      side: THREE.DoubleSide
    });
    const glassBox = new THREE.Mesh(glassGeometry, glassMaterial);
    scene.add(glassBox);

    // === МЕТАЛЛИЧЕСКАЯ ОКАНТОВКА (тонкая) ===
    const ft = 0.03; // толщина окантовки — еле видна
    const metalMaterial = new THREE.MeshStandardMaterial({
      color: 0x888888,
      roughness: 0.25,
      metalness: 1.0
    });

    const hw = W / 2;
    const hh = H / 2;
    const hd = D / 2;

    // Рёбра вдоль X (4 шт.)
    const xEdgeGeo = new THREE.BoxGeometry(W, ft, ft);
    [[0, hh, hd], [0, hh, -hd], [0, -hh, hd], [0, -hh, -hd]].forEach(p => {
      const e = new THREE.Mesh(xEdgeGeo, metalMaterial);
      e.position.set(...p);
      scene.add(e);
    });

    // Рёбра вдоль Y (4 шт.)
    const yEdgeGeo = new THREE.BoxGeometry(ft, H, ft);
    [[hw, 0, hd], [hw, 0, -hd], [-hw, 0, hd], [-hw, 0, -hd]].forEach(p => {
      const e = new THREE.Mesh(yEdgeGeo, metalMaterial);
      e.position.set(...p);
      scene.add(e);
    });

    // Рёбра вдоль Z (4 шт.)
    const zEdgeGeo = new THREE.BoxGeometry(ft, ft, D);
    [[hw, hh, 0], [hw, -hh, 0], [-hw, hh, 0], [-hw, -hh, 0]].forEach(p => {
      const e = new THREE.Mesh(zEdgeGeo, metalMaterial);
      scene.add(e);
    });

    // === ЗАЩЁЛКА (спереди, +Z сторона) ===
    // Кружок (диск) на передней грани
    const latchDiskGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.03, 24);
    const latchDisk = new THREE.Mesh(latchDiskGeo, metalMaterial);
    latchDisk.rotation.x = Math.PI / 2; // поворачиваем, чтобы диск лежал на грани
    latchDisk.position.set(0, 0, hd + 0.02);
    scene.add(latchDisk);

    // Рычажок защёлки (маленький цилиндр)
    const latchLeverGeo = new THREE.BoxGeometry(0.14, 0.03, 0.02);
    const latchLever = new THREE.Mesh(latchLeverGeo, metalMaterial);
    latchLever.position.set(0, 0, hd + 0.04);
    scene.add(latchLever);

    // === ПЕТЛИ (сзади, -Z сторона, две штуки) ===
    const hingeRadius = 0.05;
    const hingeLength = 0.08;
    const hingeGeo = new THREE.CylinderGeometry(hingeRadius, hingeRadius, hingeLength, 16);
    const hingeOffsetX = 0.6; // расстояние от центра до каждой петли

    [-hingeOffsetX, hingeOffsetX].forEach(x => {
      const hinge = new THREE.Mesh(hingeGeo, metalMaterial);
      hinge.rotation.x = Math.PI / 2; // цилиндр вдоль оси Z
      hinge.position.set(x, 0, -hd - 0.02);
      scene.add(hinge);

      // Крепёжная пластина петли (маленький прямоугольник на грани)
      const plateGeo = new THREE.BoxGeometry(0.12, 0.15, 0.01);
      const plate = new THREE.Mesh(plateGeo, metalMaterial);
      plate.position.set(x, 0, -hd - 0.01);
      scene.add(plate);
    });

    // Анимация вращения
    function animate() {
      requestAnimationFrame(animate);
      scene.rotation.y += 0.008;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
