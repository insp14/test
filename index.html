<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Короб: горизонтальные разделительные линии на боковых гранях</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(2.5, 2, 4);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.1;
    controls.minDistance = 2;
    controls.maxDistance = 10;

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.3);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    const pointLight = new THREE.PointLight(0xffffff, 0.8, 50);
    pointLight.position.set(-5, 5, 5);
    scene.add(pointLight);

    // Размеры короба (как в предыдущей версии без разделения на крышку/основание)
    const W = 1.6, H = 0.5, D = 1;

    function createTexture(width, height, drawFn) {
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      drawFn(ctx, width, height);
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    // Текстура стекла: глянец + трещины + сколы
    const glassTex = createTexture(512, 512, (ctx, w, h) => {
      ctx.fillStyle = '#f5faff';
      ctx.fillRect(0, 0, w, h);

      // Тонкие царапины
      ctx.strokeStyle = '#cce0ff';
      ctx.lineWidth = 1;
      for (let i = 0; i < 30; i++) {
        const x1 = Math.random() * w, y1 = Math.random() * h;
        const x2 = x1 + (Math.random() - 0.5) * w, y2 = y1 + (Math.random() - 0.5) * h;
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      }

      // Толстые трещины
      ctx.strokeStyle = '#446699';
      ctx.lineWidth = 3;
      for (let i = 0; i < 40; i++) {
        const x1 = Math.random() * w, y1 = Math.random() * h;
        const x2 = x1 + (Math.random() - 0.5) * w, y2 = y1 + (Math.random() - 0.5) * h;
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      }

      // Сколы по краям
      ctx.fillStyle = '#223355';
      ctx.globalAlpha = 0.6;
      for (let i = 0; i < 12; i++) {
        const r = Math.random() * 20 + 10;
        let x = Math.random() * w, y = Math.random() * h;
        if (Math.random() < 0.4) x = Math.random() < 0.5 ? Math.random() * 40 : w - Math.random() * 40;
        if (Math.random() < 0.4) y = Math.random() < 0.5 ? Math.random() * 40 : h - Math.random() * 40;
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      }
    });

    // Текстура металла: бело‑голубой + ржавчина
    const metalTex = createTexture(512, 512, (ctx, w, h) => {
      ctx.fillStyle = '#dcf0ff';
      ctx.fillRect(0, 0, w, h);

      // Зернистость
      ctx.fillStyle = '#eaf6ff';
      ctx.globalAlpha = 0.2;
      for (let i = 0; i < 2500; i++) {
        ctx.fillRect(Math.random() * w, Math.random() * h, 1, 1);
      }

      // Потертости
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = '#557799';
      for (let i = 0; i < 10; i++) {
        ctx.beginPath();
        ctx.arc(Math.random() * w, Math.random() * h, Math.random() * 60 + 20, 0, Math.PI * 2);
        ctx.fill();
      }

      // Ржавчина
      ctx.globalAlpha = 0.7;
      ctx.fillStyle = '#b85a2a'; 
      for (let i = 0; i < 8; i++) {
        const r = Math.random() * 50 + 15;
        ctx.beginPath();
        ctx.arc(Math.random() * w, Math.random() * h, r, 0, Math.PI * 2);
        ctx.fill();
      }
    });

    const glassMaterial = new THREE.MeshPhysicalMaterial({
      map: glassTex,
      transparent: true,
      opacity: 0.32,
      roughness: 0.05,
      metalness: 0.0,
      ior: 1.52,
      transmission: 0.9,
      clearcoat: 1.0,
      clearcoatRoughness: 0.03,
      reflectivity: 0.55,
      side: THREE.DoubleSide
    });

    const metalMaterial = new THREE.MeshStandardMaterial({
      map: metalTex,
      roughness: 0.45,
      metalness: 0.8
    });

    const ft = 0.02; // толщина металлической окантовки
    const hw = W / 2, hh = H / 2, hd = D / 2, offset = 0.01;

    // Основной стеклянный короб (цельный, как раньше)
    const glassGeometry = new THREE.BoxGeometry(W, H, D);
    const glassBox = new THREE.Mesh(glassGeometry, glassMaterial);
    scene.add(glassBox);

    // Каркас ребер (окантовка по периметру)
    const xEdgeGeo = new THREE.BoxGeometry(W - offset, ft, ft);
    [[0, hh + offset/2, hd], [0, hh + offset/2, -hd], [0, -hh - offset/2, hd], [0, -hh - offset/2, -hd]].forEach(p => {
      const e = new THREE.Mesh(xEdgeGeo, metalMaterial);
      e.position.set(...p);
      scene.add(e);
    });

    const yEdgeGeo = new THREE.BoxGeometry(ft, H - offset, ft);
    [[hw, 0, hd], [hw, 0, -hd], [-hw, 0, hd], [-hw, 0, -hd]].forEach(p => {
      const e = new THREE.Mesh(yEdgeGeo, metalMaterial);
      e.position.set(...p);
      scene.add(e);
    });

    const zEdgeGeo = new THREE.BoxGeometry(ft, ft, D - offset);
    [[hw, hh, 0], [hw, -hh, 0], [-hw, hh, 0], [-hw, -hh, 0]].forEach(p => {
      const e = new THREE.Mesh(zEdgeGeo, metalMaterial);
      e.position.set(...p);
      scene.add(e);
    });

    // Горизонтальные разделительные линии на боковых плоскостях (кроме верхней и нижней)
    // Высота линии — посередине высоты короба
    const midY = 0; 

    // Линия на передней и задней плоскости (вдоль оси X)
    const horizLineGeoXZ = new THREE.BoxGeometry(W - offset, ft, ft);
    [hd, -hd].forEach(zPos => {
      const line = new THREE.Mesh(horizLineGeoXZ, metalMaterial);
      line.position.set(0, midY, zPos);
      scene.add(line);
    });

    // Линия на левой и правой плоскости (вдоль оси Z)
    const horizLineGeoZX = new THREE.BoxGeometry(ft, ft, D - offset);
    [hw, -hw].forEach(xPos => {
      const line = new THREE.Mesh(horizLineGeoZX, metalMaterial);
      line.position.set(xPos, midY, 0);
      scene.add(line);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
